<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head}">
    <title>Gestionar Incidencia - SEPA 1914</title>
</head>
<body>
<div class="container-fluid">
    <div class="row">
        <div th:replace="~{layout :: menu}"></div>

        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4">
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a th:href="@{/incidencias/lista}">Incidencias</a></li>
                    <li class="breadcrumb-item active">Gestión de Aviso</li>
                </ol>
            </nav>

            <div class="card shadow-sm border-0">
                <div class="card-header bg-dark text-white p-3">
                    <h5 class="mb-0"><i class="bi bi-tools me-2"></i> Detalle de la Incidencia #<span th:text="${incidencia.id}">1</span></h5>
                </div>
                <div class="card-body p-4">
                    <form th:action="@{/incidencias/actualizar}" th:object="${incidencia}" method="post">
                        <input type="hidden" th:field="*{id}">

                        <div class="row">
                            <div class="col-md-8">
                                <h3 class="fw-bold text-primary" th:text="*{titulo}">Título</h3>
                                <p class="text-muted" th:text="*{descripcion}">Descripción detallada...</p>
                                <hr>
                                <p><strong>Comunidad:</strong> <span th:text="*{comunidad?.nombre}">Nombre</span></p>
                                <p><strong>Fecha Reporte:</strong> <span th:text="${#temporals.format(incidencia.fechaRegistro, 'dd/MM/yyyy HH:mm')}">Fecha</span></p>
                            </div>

                            <div class="col-md-4 bg-light p-4 rounded border">
                                <div class="mb-3">
                                    <label class="form-label fw-bold">Estado Actual</label>
                                    <select th:field="*{estado}" class="form-select border-primary">
                                        <option th:each="est : ${estados}" th:value="${est}" th:text="${est}"></option>
                                    </select>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label fw-bold">Coste Estimado (€)</label>
                                    <input type="number" step="0.01" th:field="*{costeEstimado}" class="form-control" placeholder="0.00">
                                </div>

                                <button type="submit" class="btn btn-primary w-100 mb-2">
                                    <i class="bi bi-save"></i> Guardar Cambios
                                </button>
                                <a th:href="@{/incidencias/lista}" class="btn btn-outline-secondary w-100">Volver</a>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </main>
    </div>
</div>
</body>
</html>
