<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head}">
    <title>Panel de Control - SEPA 1914</title>
</head>
<body class="bg-light">
<div class="container-fluid">
    <div class="row">
        <div th:replace="~{layout :: menu}"></div>

        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4">
            <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-4 border-bottom">
                <h1 class="h2 fw-bold text-dark"><i class="bi bi-speedometer2 text-primary me-2"></i>Panel de Control</h1>
                <div class="badge bg-white text-dark border shadow-sm p-2 px-3">
                    <i class="bi bi-person-circle text-primary me-2"></i>
                    Administrador: <span class="fw-bold" th:text="${#authentication?.name}">Usuario</span>
                </div>
            </div>

            <div class="row g-4 mb-5">
                <div class="col-md-4">
                    <a th:href="@{/comunidades/lista}" class="text-decoration-none transition-card">
                        <div class="card border-0 shadow-sm border-start border-primary border-4 h-100">
                            <div class="card-body">
                                <div class="d-flex justify-content-between align-items-center">
                                    <div>
                                        <div class="text-muted small text-uppercase fw-bold">Comunidades</div>
                                        <div class="h3 fw-bold mb-0 text-dark" th:text="${totalComunidades}">0</div>
                                    </div>
                                    <div class="bg-primary bg-opacity-10 p-3 rounded-circle"><i class="bi bi-buildings fs-3 text-primary"></i></div>
                                </div>
                            </div>
                        </div>
                    </a>
                </div>

                <div class="col-md-4">
                    <a th:href="@{/vecinos/lista}" class="text-decoration-none transition-card">
                        <div class="card border-0 shadow-sm border-start border-success border-4 h-100">
                            <div class="card-body">
                                <div class="d-flex justify-content-between align-items-center">
                                    <div>
                                        <div class="text-muted small text-uppercase fw-bold">Propietarios</div>
                                        <div class="h3 fw-bold mb-0 text-dark" th:text="${totalVecinos}">0</div>
                                    </div>
                                    <div class="bg-success bg-opacity-10 p-3 rounded-circle"><i class="bi bi-people fs-3 text-success"></i></div>
                                </div>
                            </div>
                        </div>
                    </a>
                </div>

                <div class="col-md-4">
                    <a th:href="@{/incidencias/lista}" class="text-decoration-none transition-card">
                        <div class="card border-0 shadow-sm border-start border-danger border-4 h-100">
                            <div class="card-body">
                                <div class="d-flex justify-content-between align-items-center">
                                    <div>
                                        <div class="text-muted small text-uppercase fw-bold">Incidencias</div>
                                        <div class="h3 fw-bold mb-0 text-dark" th:text="${totalIncidenciasEnCurso}">0</div>
                                        <div class="text-danger small fw-bold">En curso</div>
                                    </div>
                                    <div class="bg-danger bg-opacity-10 p-3 rounded-circle"><i class="bi bi-exclamation-triangle fs-3 text-danger"></i></div>
                                </div>
                            </div>
                        </div>
                    </a>
                </div>


            </div>

            <div class="card border-0 shadow-sm py-5 mt-4 text-center bg-white rounded-4">
                <div class="card-body">
                    <img th:src="@{/images/logo.png}" alt="Gombeth Urban" width="120" class="rounded-circle shadow mb-4 border border-4 border-light">
                    <h3 class="fw-bold text-dark">Gestión Integral SEPA</h3>
                    <p class="text-muted mx-auto" style="max-width: 500px;">Bienvenido al centro de mando. Desde aquí puede supervisar el estado financiero de sus comunidades y la gestión de incidencias QR.</p>
                    <div class="mt-4">
                        <a th:href="@{/comunidades/lista}" class="btn btn-primary px-4 py-2 shadow-sm rounded-pill">
                            <i class="bi bi-arrow-right-circle me-2"></i> Comenzar Gestión
                        </a>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>
<div th:replace="~{layout :: scripts}"></div>
<style>
    .transition-card:hover {
        transform: translateY(-5px);
        transition: all 0.3s ease;
        box-shadow: 0 10px 20px rgba(0,0,0,0.1) !important;
    }
</style>
</body>
</html>
