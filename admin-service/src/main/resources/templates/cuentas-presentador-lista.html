<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cuentas Presentador SEPA</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>

        body{
            background:#f5f7fb;
        }

        .card-soft{
            border:none;
            border-radius:18px;
            box-shadow:0 4px 18px rgba(0,0,0,.08);
        }

        .table thead{
            background:#1f2937;
            color:white;
        }

        .badge-activa{
            background:#198754;
        }

        .badge-inactiva{
            background:#dc3545;
        }

    </style>
</head>

<body>

<div class="container-fluid py-4">

    <!-- CABECERA -->

    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>
            <h2 class="fw-bold mb-0">
                <i class="bi bi-bank2"></i>
                Cuentas Presentador SEPA
            </h2>

            <div class="text-muted">
                Gestión profesional de cuentas presentadoras
            </div>
        </div>

        <button class="btn btn-primary"
                data-bs-toggle="modal"
                data-bs-target="#modalCuenta">

            <i class="bi bi-plus-circle"></i>
            Nueva Cuenta
        </button>

    </div>

    <!-- MENSAJES -->

    <div th:if="${mensaje}"
         class="alert alert-success alert-dismissible fade show">

        <span th:text="${mensaje}"></span>

        <button type="button"
                class="btn-close"
                data-bs-dismiss="alert"></button>
    </div>

    <!-- TABLA -->

    <div class="card card-soft">

        <div class="card-body">

            <div class="table-responsive">

                <table class="table table-hover align-middle">

                    <thead>
                    <tr>
                        <th>Alias</th>
                        <th>Banco</th>
                        <th>Identificador SEPA</th>
                        <th>IBAN</th>
                        <th>BIC</th>
                        <th>Estado</th>
                        <th width="120">Acciones</th>
                    </tr>
                    </thead>

                    <tbody>

                    <tr th:if="${#lists.isEmpty(cuentas)}">
                        <td colspan="7"
                            class="text-center text-muted py-5">

                            No existen cuentas presentadoras registradas.
                        </td>
                    </tr>

                    <tr th:each="c : ${cuentas}">

                        <td>
                            <strong th:text="${c.alias}"></strong>
                        </td>

                        <td th:text="${c.banco}"></td>

                        <td>
                            <code th:text="${c.identificadorPresentador}"></code>
                        </td>

                        <td>
                            <span th:text="${c.iban}"></span>
                        </td>

                        <td>
                            <span th:text="${c.bic}"></span>
                        </td>

                        <td>

                            <span th:if="${c.activa}"
                                  class="badge badge-activa">
                                ACTIVA
                            </span>

                            <span th:unless="${c.activa}"
                                  class="badge badge-inactiva">
                                INACTIVA
                            </span>

                        </td>

                        <td>

                            <a th:href="@{/cuentas-presentador/eliminar/{id}(id=${c.id})}"
                               class="btn btn-sm btn-outline-danger"
                               onclick="return confirm('¿Eliminar cuenta presentadora?');">

                                <i class="bi bi-trash"></i>
                            </a>

                        </td>

                    </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</div>

<!-- MODAL -->

<div class="modal fade"
     id="modalCuenta"
     tabindex="-1">

    <div class="modal-dialog modal-lg modal-dialog-scrollable">

        <div class="modal-content">

            <form th:action="@{/cuentas-presentador/guardar}"
                  method="post"
                  th:object="${cuentaForm}">

                <div class="modal-header">

                    <h5 class="modal-title">
                        Nueva Cuenta Presentadora
                    </h5>

                    <button type="button"
                            class="btn-close"
                            data-bs-dismiss="modal"></button>

                </div>

                <div class="modal-body">

                    <div class="row g-3">

                        <div class="col-md-6">

                            <label class="form-label fw-bold">
                                Alias
                            </label>

                            <input type="text"
                                   th:field="*{alias}"
                                   class="form-control"
                                   required>

                        </div>

                        <div class="col-md-6">

                            <label class="form-label fw-bold">
                                Banco
                            </label>

                            <input type="text"
                                   th:field="*{banco}"
                                   class="form-control">

                        </div>

                        <div class="col-md-6">

                            <label class="form-label fw-bold">
                                Identificador Presentador SEPA
                            </label>

                            <input type="text"
                                   th:field="*{identificadorPresentador}"
                                   class="form-control"
                                   required>

                        </div>

                        <div class="col-md-6">

                            <label class="form-label fw-bold">
                                NIF/CIF
                            </label>

                            <input type="text"
                                   th:field="*{nifCif}"
                                   class="form-control">

                        </div>

                        <div class="col-md-4">

                            <label class="form-label fw-bold">
                                Sufijo
                            </label>

                            <input type="text"
                                   th:field="*{sufijo}"
                                   class="form-control">

                        </div>
                        <div class="col-md-8">
                            <label class="form-label fw-bold">
                                IBAN
                            </label>
                            <input type="text"
                                   th:field="*{iban}"
                                   class="form-control">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">
                                BIC
                            </label>
                            <input type="text"
                                   th:field="*{bic}"
                                   class="form-control">
                        </div>
                        <div class="col-md-6 d-flex align-items-end">
                            <div class="form-check form-switch">
                                <input class="form-check-input"
                                       type="checkbox"
                                       th:field="*{activa}">
                                <label class="form-check-label">
                                    Cuenta activa
                                </label>
                            </div>
                        </div>
                        <div class="col-12">
                            <label class="form-label fw-bold">
                                Observaciones
                            </label>
                            <textarea th:field="*{observaciones}"
                                      class="form-control"
                                      rows="3"></textarea>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button"
                            class="btn btn-secondary"
                            data-bs-dismiss="modal">
                        Cancelar
                    </button>
                    <button type="submit"
                            class="btn btn-primary">
                        <i class="bi bi-save"></i>
                        Guardar Cuenta
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
