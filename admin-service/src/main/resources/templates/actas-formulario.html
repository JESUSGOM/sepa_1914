<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Redactar Acta - Gombeth Urban</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/tinymce@6/tinymce.min.js" referrerpolicy="origin"></script>
    <script>
        tinymce.init({
            selector: '#contenidoActa',
            plugins: 'lists table link code help wordcount',
            toolbar: 'undo redo | blocks | bold italic | alignleft aligncenter alignright | bullist numlist outdent indent | help',
            language: 'es',
            height: 500,
            branding: false
        });
    </script>
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="card shadow">
        <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
            <h3 class="mb-0">Redactar Acta de Reunión</h3>
            <span th:text="${comunidad.nombre}" class="badge bg-light text-primary fs-6">Nombre Comunidad</span>
        </div>
        <div class="card-body">

            <form th:action="@{/actas/guardar}" th:object="${acta}" method="post">
                <input type="hidden" th:field="*{id}" />
                <input type="hidden" name="comunidadId" th:value="${comunidad.id}" />

                <div class="row mb-3">
                    <div class="col-md-8">
                        <label class="form-label fw-bold">Título de la Reunión</label>
                        <input type="text" th:field="*{titulo}" class="form-control"
                               placeholder="Ej: Junta General Ordinaria Abril 2026" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label fw-bold">Fecha de la Reunión</label>
                        <input type="date" th:field="*{fechaReunion}" class="form-control" required>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">Contenido y Acuerdos</label>
                    <textarea id="contenidoActa" th:field="*{contenido}" class="form-control"
                              placeholder="Redacte aquí los puntos tratados..."></textarea>
                </div>

                <div class="d-flex justify-content-between mt-4">
                    <a th:href="@{/actas/comunidad/{id}(id=${comunidad.id})}" class="btn btn-secondary">
                        <i class="bi bi-arrow-left"></i> Cancelar
                    </a>
                    <button type="submit" class="btn btn-success px-5">
                        <i class="bi bi-save"></i> Guardar Borrador Blindado
                    </button>
                </div>
            </form>

        </div>
    </div>
</div>

</body>
</html>
