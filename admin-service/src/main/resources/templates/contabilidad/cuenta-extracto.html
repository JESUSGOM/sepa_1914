<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head}">
    <title>Extracto de Cuenta - SEPA 1914</title>
</head>
<body>
<div class="container-fluid">
    <div class="row">
        <div th:replace="~{layout :: menu}"></div>

        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-3">
            <nav aria-label="breadcrumb" class="mb-2">
                <ol class="breadcrumb mb-0 small">
                    <li class="breadcrumb-item"><a th:href="@{/comunidades/lista}">Comunidades</a></li>
                    <li class="breadcrumb-item active">Extracto de Cuenta</li>
                </ol>
            </nav>

            <div class="d-flex justify-content-between align-items-center border-bottom pb-2 mb-3">
                <div>
                    <h1 class="h4 mb-0">
                        <i class="bi bi-journal-text text-info"></i> Extracto:
                        <span class="text-primary" th:text="${cuenta.codigo}"></span> -
                        <small class="text-muted" th:text="${cuenta.nombre}"></small>
                    </h1>
                </div>
                <div class="text-end">
                    <span class="badge bg-dark px-3 py-2">Ejercicio <span th:text="${ejercicio}"></span></span>
                </div>
            </div>

            <div class="card shadow-sm border-0">
                <div class="card-body p-0">
                    <table class="table table-sm table-hover mb-0">
                        <thead class="table-light small">
                        <tr>
                            <th class="ps-3">Fecha</th>
                            <th>Asiento</th>
                            <th>Concepto</th>
                            <th class="text-end">Debe</th>
                            <th class="text-end">Haber</th>
                            <th class="text-end pe-3">Saldo Parcial</th>
                        </tr>
                        </thead>
                        <tbody class="small">
                        <tr th:each="m, iter : ${movimientos}">
                            <td class="ps-3" th:text="${#temporals.format(m.fecha, 'dd/MM/yyyy')}"></td>
                            <td><code class="text-muted" th:text="${m.numeroAsiento}"></code></td>
                            <td th:text="${m.concepto}"></td>
                            <td class="text-end text-primary" th:text="${m.debe > 0 ? #numbers.formatDecimal(m.debe, 1, 2, 'COMMA') + ' €' : '-'}"></td>
                            <td class="text-end text-danger" th:text="${m.haber > 0 ? #numbers.formatDecimal(m.haber, 1, 2, 'COMMA') + ' €' : '-'}"></td>
                            <td class="text-end pe-3 fw-bold">
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(movimientos)}">
                            <td colspan="6" class="text-center py-4 text-muted fst-italic">No hay movimientos en este ejercicio.</td>
                        </tr>
                        </tbody>
                        <tfoot class="table-group-divider fw-bold bg-light">
                        <tr>
                            <td colspan="3" class="ps-3">TOTALES ACUMULADOS</td>
                            <td class="text-end text-primary" th:text="${#numbers.formatDecimal(totalDebe, 1, 2, 'COMMA')} + ' €'"></td>
                            <td class="text-end text-danger" th:text="${#numbers.formatDecimal(totalHaber, 1, 2, 'COMMA')} + ' €'"></td>
                            <td class="text-end pe-3" th:classappend="${saldoFinal >= 0 ? 'text-success' : 'text-danger'}">
                                <span th:text="${#numbers.formatDecimal(saldoFinal, 1, 2, 'COMMA')} + ' €'"></span>
                            </td>
                        </tr>
                        </tfoot>
                    </table>
                </div>
            </div>

            <div class="mt-3 text-end">
                <button onclick="window.history.back()" class="btn btn-sm btn-secondary">
                    <i class="bi bi-arrow-left"></i> Volver
                </button>
            </div>
        </main>
    </div>
</div>
</body>
</html>
