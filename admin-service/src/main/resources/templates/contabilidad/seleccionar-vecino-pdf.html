<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head}"></head>
<body class="bg-light">
<div class="container-fluid">
    <div class="row">
        <div th:replace="~{layout :: menu}"></div>

        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4">
            <div class="row justify-content-center mt-5">
                <div class="col-md-7">
                    <div class="card shadow-lg border-0 rounded-4">
                        <div class="card-header bg-dark text-white p-4">
                            <h4 class="mb-0">
                                <i class="bi bi-file-earmark-check-fill me-2 text-primary"></i>
                                Generar Certificado de Deuda
                            </h4>
                            <p class="mb-0 opacity-75 small" th:text="${comunidad.nombre}">Nombre de la Comunidad</p>
                        </div>
                        <div class="card-body p-5">
                            <div class="text-center mb-4">
                                <p class="text-muted">Seleccione el propietario de la lista para emitir el certificado oficial en formato PDF.</p>
                            </div>

                            <form id="pdfForm" class="mx-auto" style="max-width: 450px;">
                                <div class="mb-4">
                                    <label for="vecinoId" class="form-label fw-bold">Propietario / Vivienda</label>
                                    <select class="form-select form-select-lg border-primary shadow-sm" id="vecinoId" required>
                                        <option value="" disabled selected>-- Seleccione un vecino --</option>
                                        <option th:each="v : ${vecinos}"
                                                th:value="${v.id}"
                                                th:text="${v.nombre} + ' (' + ${v.vivienda} + ')'">
                                        </option>
                                    </select>
                                </div>
                                <div class="d-grid gap-2">
                                    <button type="button" class="btn btn-primary btn-lg shadow" onclick="lanzarPdf()">
                                        <i class="bi bi-file-earmark-pdf-fill me-2"></i> Emitir Certificado PDF
                                    </button>
                                    <a th:href="@{/contabilidad/liquidacion/{id}(id=${comunidad.id})}" class="btn btn-link text-decoration-none text-muted">
                                        <i class="bi bi-arrow-left"></i> Volver al panel contable
                                    </a>
                                </div>
                            </form>
                        </div>
                        <div class="card-footer bg-white text-center py-3">
                            <span class="badge bg-light text-dark border">GTI Engine v2026.04 - PDF Streaming</span>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>

<script th:inline="javascript">
    function lanzarPdf() {
        const select = document.getElementById('vecinoId');
        const id = select.value;

        if(!id) {
            alert('Por favor, seleccione un propietario de la lista.');
            return;
        }

        // URL del endpoint de EMISIÓN
        const url = '/contabilidad/certificado-deudas/emitir-pdf/' + id;

        // EL CAMBIO CLAVE: window.open con '_blank' abre SOLO el PDF en pestaña nueva
        window.open(url, '_blank');
    }
</script>

<div th:replace="~{layout :: scripts}"></div>
</body>
</html>
