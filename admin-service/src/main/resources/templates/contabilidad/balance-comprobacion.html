<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head}">
    <title>Balance de Sumas y Saldos - SEPA 1914</title>
</head>
<body class="bg-light">
<div class="container-fluid">
    <div class="row">
        <div th:replace="~{layout :: menu}"></div>

        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-3">
            <nav aria-label="breadcrumb" class="mb-2">
                <ol class="breadcrumb mb-0 small">
                    <li class="breadcrumb-item"><a th:href="@{/comunidades/lista}">Comunidades</a></li>
                    <li class="breadcrumb-item"><a th:href="@{/comunidades/detalle/{id}(id=${comunidad.id})}" th:text="${comunidad.nombre}">Comunidad</a></li>
                    <li class="breadcrumb-item active">Balance de Comprobación</li>
                </ol>
            </nav>

            <div class="d-flex justify-content-between align-items-center border-bottom pb-2 mb-3">
                <div>
                    <h1 class="h4 mb-0 text-dark">
                        <i class="bi bi-layout-three-columns text-primary me-2"></i>Balance de Sumas y Saldos
                    </h1>
                    <p class="text-muted small mb-0" th:text="${'Ejercicio Contable: ' + ejercicio + ' - ' + comunidad.nombre}"></p>
                </div>
                <div class="btn-group">
                    <button onclick="window.print()" class="btn btn-sm btn-outline-secondary shadow-sm">
                        <i class="bi bi-printer me-1"></i> Imprimir
                    </button>
                    <a th:href="@{/contabilidad/diario/{id}(id=${comunidad.id})}" class="btn btn-sm btn-dark shadow-sm">
                        <i class="bi bi-journal-text me-1"></i> Ver Diario
                    </a>
                </div>
            </div>

            <div class="card shadow-sm border-0">
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-sm table-hover align-middle mb-0">
                            <thead class="bg-dark text-white">
                            <tr class="small text-uppercase">
                                <th class="ps-3 py-2" style="width: 10%">Código</th>
                                <th style="width: 30%">Cuenta Contable</th>
                                <th class="text-end border-start border-secondary" style="width: 15%">Suma Debe</th>
                                <th class="text-end" style="width: 15%">Suma Haber</th>
                                <th class="text-end border-start border-secondary text-warning" style="width: 15%">Saldo Deudor</th>
                                <th class="text-end pe-3 text-info" style="width: 15%">Saldo Acreedor</th>
                            </tr>
                            </thead>
                            <tbody class="small">
                            <tr th:each="linea : ${balance}" th:if="${linea.tieneActividad()}">
                                <td class="ps-3 fw-bold text-primary">
                                    <a th:href="@{/contabilidad/cuenta/mayor/{id}(id=${linea.codigo})}"
                                       th:text="${linea.codigo}" class="text-decoration-none"></a>
                                </td>
                                <td th:text="${linea.nombre}"></td>
                                <td class="text-end border-start bg-light" th:text="${#numbers.formatDecimal(linea.sumaDebe, 1, 2, 'COMMA')} + ' €'"></td>
                                <td class="text-end bg-light" th:text="${#numbers.formatDecimal(linea.sumaHaber, 1, 2, 'COMMA')} + ' €'"></td>
                                <td class="text-end border-start fw-bold"
                                    th:classappend="${linea.saldoDeudor > 0 ? 'text-dark' : 'text-muted opacity-25'}"
                                    th:text="${#numbers.formatDecimal(linea.saldoDeudor, 1, 2, 'COMMA')} + ' €'"></td>
                                <td class="text-end pe-3 fw-bold"
                                    th:classappend="${linea.saldoAcreedor > 0 ? 'text-dark' : 'text-muted opacity-25'}"
                                    th:text="${#numbers.formatDecimal(linea.saldoAcreedor, 1, 2, 'COMMA')} + ' €'"></td>
                            </tr>
                            </tbody>
                            <tfoot class="table-dark fw-bold">
                            <tr>
                                <td colspan="2" class="ps-3 text-uppercase">Totales de Control</td>
                                <td class="text-end" th:text="${#numbers.formatDecimal(#aggregates.sum(balance.![sumaDebe]), 1, 2, 'COMMA')} + ' €'"></td>
                                <td class="text-end" th:text="${#numbers.formatDecimal(#aggregates.sum(balance.![sumaHaber]), 1, 2, 'COMMA')} + ' €'"></td>
                                <td class="text-end" th:text="${#numbers.formatDecimal(#aggregates.sum(balance.![saldoDeudor]), 1, 2, 'COMMA')} + ' €'"></td>
                                <td class="text-end pe-3" th:text="${#numbers.formatDecimal(#aggregates.sum(balance.![saldoAcreedor]), 1, 2, 'COMMA')} + ' €'"></td>
                            </tr>
                            </tfoot>
                        </table>
                    </div>
                </div>
            </div>

            <div class="mt-3 d-flex justify-content-end">
                <div class="badge bg-success p-2 px-3 shadow-sm" th:if="${#aggregates.sum(balance.![sumaDebe]) == #aggregates.sum(balance.![sumaHaber])}">
                    <i class="bi bi-check-all me-1"></i> CONTABILIDAD CUADRADA
                </div>
                <div class="badge bg-danger p-2 px-3 shadow-sm" th:unless="${#aggregates.sum(balance.![sumaDebe]) == #aggregates.sum(balance.![sumaHaber])}">
                    <i class="bi bi-exclamation-triangle me-1"></i> DESCUADRE DETECTADO
                </div>
            </div>
        </main>
    </div>
</div>

<style>
    .table th { font-weight: 600; letter-spacing: 0.5px; }
    .table-hover tbody tr:hover { background-color: rgba(0,123,255,0.05); }
    @media print {
        .btn-group, .breadcrumb, nav, .menu-sidebar { display: none !important; }
        .col-md-9 { width: 100% !important; flex: 0 0 100% !important; max-width: 100% !important; }
        .card { border: 1px solid #dee2e6 !important; shadow: none !important; }
    }
</style>
</body>
</html>
