<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head}"></head>
<body class="bg-light">
<div class="container-fluid">
    <div class="row">
        <div th:replace="~{layout :: menu}"></div>

        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4">
            <div class="card shadow-lg border-0 rounded-4 mx-auto" style="max-width: 800px; margin-top: 2rem;">
                <div class="card-header bg-dark text-white p-4">
                    <h4 class="mb-0">
                        <i class="bi bi-megaphone-fill me-2 text-warning"></i>
                        Configuración de Convocatoria de Junta
                    </h4>
                    <p class="mb-0 opacity-75 small" th:text="${comunidad.nombre}">Nombre de la Comunidad</p>
                </div>

                <form th:action="@{/contabilidad/convocatoria/emitir-pdf}" method="post" target="_blank" class="card-body p-5">
                    <input type="hidden" name="comunidadId" th:value="${comunidad.id}">

                    <div class="row g-4">
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Fecha de la Junta</label>
                            <div class="input-group">
                                <span class="input-group-text bg-white border-end-0"><i class="bi bi-calendar-event text-primary"></i></span>
                                <input type="date" name="fechaJunta" class="form-control border-start-0" required>
                            </div>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label fw-bold">Hora (1ª y 2ª convocatoria)</label>
                            <div class="input-group">
                                <span class="input-group-text bg-white border-end-0"><i class="bi bi-clock text-primary"></i></span>
                                <input type="text" name="horaJunta" class="form-control border-start-0" placeholder="Ej: 19:00 y 19:30" required>
                            </div>
                        </div>

                        <div class="col-12">
                            <label class="form-label fw-bold">Lugar de celebración</label>
                            <div class="input-group">
                                <span class="input-group-text bg-white border-end-0"><i class="bi bi-geo-alt text-primary"></i></span>
                                <input type="text" name="lugarJunta" class="form-control border-start-0" placeholder="Ej: Portón de la comunidad / Local social" required>
                            </div>
                        </div>

                        <div class="col-12">
                            <label class="form-label fw-bold">Orden del Día</label>
                            <textarea name="ordenDia" class="form-control shadow-sm" rows="8"
                                      placeholder="Indique los puntos a tratar..." required
                                      style="resize: none;"></textarea>
                            <div class="form-text mt-2">Cada línea aparecerá como un punto numerado en el documento oficial.</div>
                        </div>
                    </div>

                    <div class="d-grid gap-2 mt-5">
                        <button type="submit" class="btn btn-warning btn-lg fw-bold shadow-sm">
                            <i class="bi bi-file-earmark-pdf-fill me-2"></i> GENERAR DOCUMENTO PDF
                        </button>
                        <a th:href="@{/dashboard}" class="btn btn-link text-decoration-none text-muted">
                            <i class="bi bi-arrow-left"></i> Volver al panel principal
                        </a>
                    </div>
                </form>

                <div class="card-footer bg-white text-center py-3">
                    <span class="badge bg-light text-dark border">GTI System - Módulo de Asamblea</span>
                </div>
            </div>
        </main>
    </div>
</div>

<div th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</div>
</body>
</html>
