<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head}">
    <title>Gestión de Propietarios - SEPA 1914</title>
</head>
<body class="bg-light">
<div class="container-fluid">
    <div class="row">
        <div th:replace="~{layout :: menu}"></div>

        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4">
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb small">
                    <li class="breadcrumb-item"><a th:href="@{/comunidades/lista}">Comunidades</a></li>
                    <li class="breadcrumb-item active" th:text="${comunidad.nombre}">Nombre de la Comunidad</li>
                    <li class="breadcrumb-item active" aria-current="page">Listado de Propietarios</li>
                </ol>
            </nav>

            <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                <h1 class="h2">
                    <i class="bi bi-people-fill text-primary me-2"></i>
                    Propietarios y Coeficientes
                </h1>

                <form th:action="@{/vecinos/lista}" method="get" class="d-flex gap-2 ms-auto me-3">
                    <input type="hidden" name="comunidadId" th:value="${comunidad.id}">
                    <div class="input-group input-group-sm">
                        <input type="text" name="buscar" th:value="${searchTerm}" class="form-control" placeholder="Buscar por nombre o vivienda..." style="width: 250px;">
                        <button type="submit" class="btn btn-primary"><i class="bi bi-search"></i></button>
                        <a th:href="@{/vecinos/lista(comunidadId=${comunidad.id})}" class="btn btn-outline-secondary" th:if="${searchTerm}"><i class="bi bi-x-circle"></i></a>
                    </div>
                </form>

                <div class="btn-toolbar mb-2 mb-md-0">
                    <a th:href="@{/vecinos/nuevo(comunidadId=${comunidad.id})}" class="btn btn-sm btn-primary shadow-sm">
                        <i class="bi bi-plus-circle me-1"></i> Nuevo Propietario
                    </a>
                </div>
            </div>

            <div th:if="${mensaje}" class="alert alert-success alert-dismissible fade show shadow-sm" role="alert">
                <i class="bi bi-check-circle-fill me-2"></i>
                <span th:text="${mensaje}">Mensaje de éxito</span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>

            <div class="card shadow-sm border-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0" id="tablaVecinos" style="font-size: 0.88rem;">
                        <thead class="table-dark">
                        <tr>
                            <th class="ps-3">Vivienda</th>
                            <th>Nombre Propietario</th> <th>NIF / CIF</th>          <th>IBAN Cuenta</th>        <th class="text-center">SEPA</th> <th class="text-center">Estado</th> <th class="text-end pe-3 no-sort">Gestión</th> </tr>
                        </thead>
                        <tbody>
                        <tr th:each="v : ${vecinos}">
                            <td class="ps-3 fw-bold" th:text="${v.vivienda}">1A</td>
                            <td th:text="${v.nombre}" class="fw-semibold">Nombre</td>
                            <td th:text="${v.nif}" class="text-muted">NIF</td>
                            <td>
                                <code class="text-primary" th:text="${v.iban}">IBAN</code>
                            </td>
                            <td class="text-center">
                                <span th:if="${v.domiciliado}" class="badge bg-success-subtle text-success border border-success-subtle"><i class="bi bi-bank"></i></span>
                                <span th:unless="${v.domiciliado}" class="badge bg-light text-muted border"><i class="bi bi-cash"></i></span>
                            </td>
                            <td class="text-center">
                                <span class="badge rounded-pill" th:classappend="${v.activo ? 'bg-success' : 'bg-danger'}" th:text="${v.activo ? 'Activo' : 'Baja'}">Activo</span>
                            </td>
                            <td class="text-end pe-3">
                                <div class="btn-group shadow-sm">
                                    <a th:href="@{/conceptos/vecino/{id}(id=${v.id})}" class="btn btn-sm btn-outline-dark" title="Conceptos de Cobro">
                                        <i class="bi bi-list-stars"></i>
                                    </a>
                                    <a th:if="${v.iban != null and !#strings.isEmpty(v.iban)}"
                                       th:href="@{/vecinos/mandato-pdf/{id}(id=${v.id})}"
                                       class="btn btn-sm btn-outline-danger"
                                       title="Guardar Mandato SEPA en Disco Local">
                                        <i class="bi bi-file-earmark-check"></i>
                                    </a>
                                    <button type="button" class="btn btn-sm btn-warning"
                                            th:data-id="${v.id}"
                                            th:data-nombre="${v.nombre}"
                                            th:data-nif="${v.nif}"
                                            th:data-vivienda="${v.vivienda}"
                                            th:data-email="${v.email}"
                                            th:data-activo="${v.activo}"
                                            th:data-domiciliado="${v.domiciliado}"
                                            th:data-coef="${v.coeficiente}"
                                            th:data-iban="${v.iban}"
                                            th:data-bic="${v.bic}"
                                            th:data-mandato="${v.referenciaMandato}"
                                            onclick="cargarYMostrarModal(this)"
                                            title="Editar Datos">
                                        <i class="bi bi-pencil-fill"></i>
                                    </button>
                                    <a th:href="@{/vecinos/eliminar/{id}(id=${v.id})}"
                                       class="btn btn-sm btn-danger"
                                       onclick="return confirm('¿Eliminar propiedad y todos sus datos asociados?')"
                                       title="Eliminar Vecino">
                                        <i class="bi bi-trash-fill"></i>
                                    </a>
                                </div>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <nav th:if="${totalPages > 1}" class="mt-4">
                <ul class="pagination pagination-sm justify-content-center shadow-sm">
                    <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                        <a class="page-link" th:href="@{/vecinos/lista(comunidadId=${comunidad.id}, buscar=${searchTerm}, page=${currentPage - 1})}">
                            <i class="bi bi-chevron-left"></i> Anterior
                        </a>
                    </li>
                    <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages - 1)}" th:classappend="${currentPage == i} ? 'active'">
                        <a class="page-link" th:href="@{/vecinos/lista(comunidadId=${comunidad.id}, buscar=${searchTerm}, page=${i})}" th:text="${i + 1}">1</a>
                    </li>
                    <li class="page-item" th:classappend="${currentPage == totalPages - 1} ? 'disabled'">
                        <a class="page-link" th:href="@{/vecinos/lista(comunidadId=${comunidad.id}, buscar=${searchTerm}, page=${currentPage + 1})}">
                            Siguiente <i class="bi bi-chevron-right"></i>
                        </a>
                    </li>
                </ul>
            </nav>
        </main>
    </div>
</div>

<div class="modal fade" id="modalEditarVecino" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content shadow-lg border-0">
            <form th:action="@{/vecinos/guardar}" method="post">
                <div class="modal-header bg-warning py-3">
                    <h5 class="modal-title fw-bold"><i class="bi bi-pencil-square me-2"></i> FICHA MAESTRA DEL PROPIETARIO</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body p-4">
                    <input type="hidden" name="id" id="editId">
                    <input type="hidden" name="comunidadId" th:value="${comunidad.id}">
                    <div class="row g-3">
                        <div class="col-md-8">
                            <label class="form-label fw-bold small">Nombre / Razón Social</label>
                            <input type="text" name="nombre" id="editNombre" class="form-control" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-bold small">NIF / CIF</label>
                            <input type="text" name="nif" id="editNif" class="form-control" required>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label fw-bold small">Vivienda</label>
                            <input type="text" name="vivienda" id="editVivienda" class="form-control" required>
                        </div>
                        <div class="col-md-9">
                            <label class="form-label fw-bold small">Email Principal</label>
                            <input type="email" name="email" id="editEmail" class="form-control">
                        </div>
                        <div class="col-md-9">
                            <label class="form-label fw-bold small">IBAN</label>
                            <input type="text" name="iban" id="editIban" class="form-control font-monospace">
                        </div>
                        <div class="col-md-3">
                            <label class="form-label fw-bold small">BIC</label>
                            <input type="text" name="bic" id="editBic" class="form-control">
                        </div>
                        <div class="col-md-8">
                            <label class="form-label fw-bold small text-muted">Referencia Mandato</label>
                            <input type="text" name="referenciaMandato" id="editMandato" class="form-control bg-light" readonly>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-bold small">Coeficiente %</label>
                            <input type="number" step="0.0001" name="coeficiente" id="editCoef" class="form-control">
                        </div>
                        <div class="col-12 mt-4 pt-3 border-top">
                            <div class="form-check form-switch d-inline-block me-4">

                                <input type="hidden" name="_domiciliado" value="on"/>

                                <input class="form-check-input"
                                       type="checkbox"
                                       name="domiciliado"
                                       id="editDom">

                                <label class="form-check-label fw-bold">
                                    ¿DOMICILIAR RECIBOS?
                                </label>

                            </div>

                            <div class="form-check form-switch d-inline-block">

                                <input type="hidden" name="_activo" value="on"/>

                                <input class="form-check-input"
                                       type="checkbox"
                                       name="activo"
                                       id="editActivo">

                                <label class="form-check-label fw-bold">
                                    Vecino Activo
                                </label>

                            </div>
                        </div>
                    </div>
                </div>
                <div class="modal-footer bg-light">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-warning fw-bold px-4">ACTUALIZAR FICHA</button>
                </div>
            </form>
        </div>
    </div>
</div>

<link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css">
<script src="https://code.jquery.com/jquery-3.7.0.js"></script>
<script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap5.min.js"></script>

<div th:replace="~{layout :: scripts}"></div>

<script th:inline="none">
    $(document).ready(function() {
        if ($.fn.DataTable.isDataTable('#tablaVecinos')) {
            $('#tablaVecinos').DataTable().destroy();
        }

        $('#tablaVecinos').DataTable({
            "language": {
                "url": "//cdn.datatables.net/plug-ins/1.13.6/i18n/es-ES.json"
            },
            "paging": false,
            "searching": false,
            "info": false,
            "columnDefs": [
                { "orderable": false, "targets": "no-sort" }
            ],
            "order": [[0, 'asc']]
        });
    });

    function cargarYMostrarModal(btn) {
        document.getElementById('editId').value = btn.getAttribute('data-id');
        document.getElementById('editNombre').value = btn.getAttribute('data-nombre');
        document.getElementById('editNif').value = btn.getAttribute('data-nif');
        document.getElementById('editVivienda').value = btn.getAttribute('data-vivienda');
        document.getElementById('editEmail').value = btn.getAttribute('data-email');
        document.getElementById('editIban').value = btn.getAttribute('data-iban');
        document.getElementById('editBic').value = btn.getAttribute('data-bic');
        document.getElementById('editCoef').value = btn.getAttribute('data-coef');
        document.getElementById('editMandato').value = btn.getAttribute('data-mandato');
        document.getElementById('editDom').checked = (btn.getAttribute('data-domiciliado') === 'true');
        document.getElementById('editActivo').checked = (btn.getAttribute('data-activo') === 'true');
        var myModal = new bootstrap.Modal(document.getElementById('modalEditarVecino'));
        myModal.show();
    }
</script>

<style>
    .font-monospace { font-family: 'Courier New', monospace; letter-spacing: 1px; }
    .table-hover tbody tr:hover { background-color: rgba(13, 110, 253, 0.05); }
    .dataTables_wrapper { padding: 0; }
    table.dataTable thead th { border-bottom: none !important; }
    .table td { padding: 0.4rem 0.5rem; }
</style>
</body>
</html>
