<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head}">
    <title>Gestión de Incidencias - SEPA 1914</title>
</head>
<body class="bg-light">
<div class="container-fluid">
    <div class="row">
        <div th:replace="~{layout :: menu}"></div>

        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4">
            <div class="d-flex justify-content-between align-items-center border-bottom pb-3 mb-4">
                <h1 class="h2"><i class="bi bi-tools text-warning"></i> Averías e Incidencias</h1>
                <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#nuevaIncidenciaModal">
                    <i class="bi bi-plus-lg"></i> Registrar Avería
                </button>
            </div>

            <div class="row">
                <div class="col-md-4 mb-4" th:each="i : ${incidencias}">
                    <div class="card shadow-sm border-0 h-100">
                        <div class="card-header bg-white d-flex justify-content-between">
                            <span th:class="${'badge ' +
                                (i.prioridad.name() == 'URGENTE' ? 'bg-danger' :
                                 i.prioridad.name() == 'ALTA' ? 'bg-warning text-dark' : 'bg-info')}"
                                  th:text="${i.prioridad}">Prioridad</span>
                            <small class="text-muted" th:text="${#temporals.format(i.fechaRegistro, 'dd/MM/yyyy')}"></small>
                        </div>
                        <div class="card-body">
                            <h5 class="card-title fw-bold" th:text="${i.titulo}">Título Avería</h5>
                            <p class="card-text text-muted small" th:text="${i.descripcion}">Descripción corta...</p>

                            <div class="mt-3">
                                <label class="small fw-bold text-uppercase opacity-50">Estado:</label>
                                <select class="form-select form-select-sm" th:onchange="'actualizarEstado(' + ${i.id} + ', this.value)'">
                                    <option th:each="status : ${T(com.sepa1914.adminservice.model.Incidencia.EstadoIncidencia).values()}"
                                            th:value="${status}" th:text="${status}"
                                            th:selected="${status == i.estado}"></option>
                                </select>
                            </div>
                        </div>
                        <div class="card-footer bg-white border-top-0 pb-3">
                            <button class="btn btn-sm btn-outline-primary w-100">
                                <i class="bi bi-paperclip"></i> Asociar Factura / Pago
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <div th:if="${#lists.isEmpty(incidencias)}" class="text-center py-5">
                <i class="bi bi-shield-check display-1 text-success opacity-25"></i>
                <p class="h4 text-muted mt-3">No hay incidencias abiertas en esta comunidad.</p>
            </div>
        </main>
    </div>
</div>
</body>
</html>
