<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head}">
    <title>Panel de Incidencias - SEPA 1914</title>
</head>
<body>
<div class="container-fluid">
    <div class="row">
        <div th:replace="~{layout :: menu}"></div>

        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4">
            <div class="d-flex justify-content-between align-items-center border-bottom pb-2 mb-3">
                <h2><i class="bi bi-exclamation-triangle text-warning"></i> Panel de Incidencias en Tiempo Real</h2>
                <span class="badge bg-success" id="ws-status">Conectado</span>
            </div>

            <div class="table-responsive">
                <table class="table table-hover shadow-sm bg-white rounded">
                    <thead class="table-dark">
                    <tr>
                        <th>Fecha</th>
                        <th>Comunidad</th>
                        <th>Asunto</th>
                        <th>Urgencia</th>
                        <th>Estado</th>
                        <th>Acciones</th>
                    </tr>
                    </thead>
                    <tbody id="tabla-incidencias">
                    <tr th:each="i : ${incidencias}">
                        <td th:text="${#temporals.format(i.fechaRegistro, 'dd/MM/yyyy HH:mm')}">Fecha</td>
                        <td th:text="${i.comunidad != null ? i.comunidad.nombre : 'General'}">Comunidad</td>
                        <td class="fw-bold" th:text="${i.titulo}">Asunto</td>
                        <td>
                            <span class="badge" th:classappend="${i.prioridad.name() == 'ALTA' ? 'bg-danger' : (i.prioridad.name() == 'MEDIA' ? 'bg-warning' : 'bg-info')}" th:text="${i.prioridad}">MEDIA</span>
                        </td>
                        <td>
                            <span class="badge bg-secondary" th:text="${i.estado}">PENDIENTE</span>
                        </td>
                        <td>
                            <a th:href="@{/incidencias/gestionar/{id}(id=${i.id})}" class="btn btn-sm btn-outline-primary">Gestionar</a>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.5.0/sockjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
<script th:inline="javascript">
    var socket = new SockJS('/ws-incidencias');
    var stompClient = Stomp.over(socket);

    stompClient.connect({}, function (frame) {
        console.log('Conectado a WebSockets: ' + frame);

        stompClient.subscribe('/topic/incidencias', function (response) {
            var incidencia = JSON.parse(response.body);
            agregarIncidenciaALaLista(incidencia);
            reproducirSonidoAlerta(); // Opcional: para que pite
        });
    });

    function agregarIncidenciaALaLista(i) {
        var fila = `
            <tr class="table-info animate__animated animate__fadeInDown">
                <td>Recién llegada</td>
                <td>${i.comunidad ? i.comunidad.nombre : 'Nueva'}</td>
                <td class="fw-bold text-danger">${i.titulo}</td>
                <td><span class="badge bg-danger">${i.prioridad}</span></td>
                <td><span class="badge bg-secondary">PENDIENTE</span></td>
                <td><a href="/incidencias/gestionar/${i.id}" class="btn btn-sm btn-primary">VER AHORA</a></td>
            </tr>`;
        document.getElementById('tabla-incidencias').insertAdjacentHTML('afterbegin', fila);
    }
</script>
</body>
</html>
