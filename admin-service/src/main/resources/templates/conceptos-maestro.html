<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head}">
    <title>Maestro de Conceptos - SEPA 1914</title>
</head>

<body class="bg-light">

<div class="container-fluid">
    <div class="row">
        <div th:replace="~{layout :: menu}"></div>
        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4">
            <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                <h1 class="h2">
                    <i class="bi bi-list-stars text-primary"></i>
                    Maestro de Conceptos
                </h1>
                <p class="text-muted small">
                    Defina las plantillas globales con su vinculación contable normativa.
                </p>
            </div>
            <!-- ========================================================= -->
            <!-- NUEVO CONCEPTO -->
            <!-- ========================================================= -->
            <div class="card shadow-sm mb-4 border-0">
                <div class="card-header bg-dark text-white fw-bold py-3">
                    <i class="bi bi-plus-lg me-2"></i>
                    Registrar Nuevo Concepto Global
                </div>
                <div class="card-body bg-white">
                    <form th:action="@{/conceptos/maestro/guardar}"
                          method="post"
                          class="row g-3 needs-validation"
                          novalidate>
                        <!-- DESCRIPCIÓN -->
                        <div class="col-md-3">
                            <label class="form-label small fw-bold text-uppercase text-muted">
                                Nombre del Concepto
                            </label>
                            <input type="text"
                                   name="descripcion"
                                   class="form-control shadow-sm"
                                   placeholder="Ej: Cuota Comunidad, Cochera..."
                                   required>
                        </div>
                        <!-- CUENTA -->
                        <div class="col-md-3">
                            <label class="form-label small fw-bold text-uppercase text-primary">
                                Cuenta Contable Defecto
                            </label>
                            <select name="cuentaContableId"
                                    class="form-select border-primary-subtle"
                                    required>
                                <option value="">
                                    -- Seleccione vinculación --
                                </option>
                                <optgroup label="Ingresos">
                                    <option th:each="cta : ${cuentasIngreso}"
                                            th:value="${cta.id}"
                                            th:text="${cta.codigo + ' - ' + cta.nombre}">
                                    </option>
                                </optgroup>
                                <optgroup label="Pasivo">
                                    <option th:each="cta : ${cuentasPasivo}"
                                            th:value="${cta.id}"
                                            th:text="${cta.codigo + ' - ' + cta.nombre}">
                                    </option>
                                </optgroup>
                            </select>
                        </div>
                        <!-- TIPO IMPUESTO -->
                        <div class="col-md-2">
                            <label class="form-label small fw-bold text-uppercase text-warning">
                                Tipo Impuesto
                            </label>
                            <select name="tipoImpuesto"
                                    class="form-select border-warning-subtle">
                                <option value="EXENTO">EXENTO</option>
                                <option value="IVA">IVA</option>
                                <option value="IGIC">IGIC</option>
                                <option value="IPSI">IPSI</option>
                            </select>
                        </div>
                        <!-- PORCENTAJE -->
                        <div class="col-md-1">
                            <label class="form-label small fw-bold text-uppercase text-warning">%</label>
                            <input type="number"
                                   step="0.01"
                                   min="0"
                                   max="100"
                                   name="porcentajeImpuesto"
                                   value="0"
                                   class="form-control border-warning-subtle">
                        </div>
                        <!-- PERIODICIDAD -->
                        <div class="col-md-2">
                            <label class="form-label small fw-bold text-uppercase text-muted">
                                Periodicidad
                            </label>
                            <select id="periodSelect"
                                    name="periodicidad"
                                    class="form-select"
                                    onchange="toggleMesInicio()">
                                <option value="MENSUAL">Mensual</option>
                                <option value="BIMESTRAL">Bimestral</option>
                                <option value="TRIMESTRAL">Trimestral</option>
                                <option value="CUATRIMESTRAL">Cuatrimestral</option>
                                <option value="SEMESTRAL">Semestral</option>
                                <option value="ANUAL">Anual</option>
                            </select>
                        </div>
                        <!-- MES -->
                        <div class="col-md-1"
                             id="divMesInicio"
                             style="display:none;">
                            <label class="form-label small fw-bold text-uppercase text-muted">
                                Mes
                            </label>
                            <select name="mesInicio"
                                    class="form-select border-primary-subtle">
                                <option value="1">Enero</option>
                                <option value="2">Febrero</option>
                                <option value="3">Marzo</option>
                                <option value="4">Abril</option>
                                <option value="5">Mayo</option>
                                <option value="6">Junio</option>
                                <option value="7">Julio</option>
                                <option value="8">Agosto</option>
                                <option value="9">Septiembre</option>
                                <option value="10">Octubre</option>
                                <option value="11">Noviembre</option>
                                <option value="12">Diciembre</option>
                            </select>
                        </div>
                        <input type="hidden"
                               name="importe"
                               value="0">
                        <div class="col-12 text-end mt-3 border-top pt-3">
                            <button type="submit"
                                    class="btn btn-primary px-4 shadow-sm">
                                <i class="bi bi-save me-1"></i>
                                Crear Plantilla Maestra
                            </button>
                        </div>
                    </form>
                </div>
            </div>
            <!-- ========================================================= -->
            <!-- TABLA -->
            <!-- ========================================================= -->
            <div class="card shadow-sm border-0">
                <div class="card-header bg-white py-3">
                    <span class="text-muted small fw-bold text-uppercase">
                        Catálogo de Conceptos Disponibles
                    </span>
                </div>
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-light">
                            <tr class="small text-muted text-uppercase">
                                <th class="ps-4">Descripción</th>
                                <th>Cuenta</th>
                                <th>Periodicidad</th>
                                <th>Impuesto</th>
                                <th>%</th>
                                <th class="text-center">Mes</th>
                                <th class="text-center">Acciones</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="c : ${conceptosMaestros}">
                                <td class="ps-4 fw-bold text-dark"
                                    th:text="${c.descripcion}">
                                </td>
                                <td>
                                    <span th:if="${c.cuentaContable != null}"
                                          class="badge bg-secondary-subtle text-secondary border border-secondary-subtle"
                                          th:text="${c.cuentaContable.codigo}">
                                    </span>
                                    <span th:unless="${c.cuentaContable != null}"
                                          class="text-muted small italic">
                                        Sin asignar
                                    </span>
                                </td>
                                <td>
                                    <span class="badge rounded-pill bg-info-subtle text-info border border-info-subtle px-3"
                                          th:text="${c.periodicidad}">
                                    </span>
                                </td>
                                <td>
                                    <span class="badge bg-warning text-dark"
                                          th:text="${c.tipoImpuesto}">
                                    </span>
                                </td>
                                <td>
                                    <span class="fw-bold"
                                          th:text="${c.porcentajeImpuesto}">
                                    </span> %
                                </td>
                                <td class="text-center">
                                    <span th:if="${c.periodicidad.name() != 'MENSUAL'}"
                                          class="text-muted small fw-bold">
                                        Mes
                                        <span th:text="${c.mesInicio}"></span>
                                    </span>
                                    <span th:unless="${c.periodicidad.name() != 'MENSUAL'}"
                                          class="text-muted small">-</span>
                                </td>
                                <td class="text-center">
                                    <div class="btn-group">
                                        <button class="btn btn-sm btn-outline-primary border-0"
                                                th:onclick="abrirModalEdicion(
                                                [[${c.id}]],
                                                [[${c.descripcion}]],
                                                [[${c.periodicidad}]],
                                                [[${c.mesInicio}]],
                                                [[${c.cuentaContable != null ? c.cuentaContable.id : null}]],
                                                [[${c.tipoImpuesto}]],
                                                [[${c.porcentajeImpuesto}]]
                                                )">
                                            <i class="bi bi-pencil-square"></i>
                                        </button>
                                        <form th:action="@{/conceptos/maestro/eliminar/{id}(id=${c.id})}"
                                              method="post"
                                              onsubmit="return confirm('¿Eliminar esta plantilla?')">
                                            <button type="submit"
                                                    class="btn btn-sm btn-outline-danger border-0">
                                                <i class="bi bi-trash3-fill"></i>
                                            </button>
                                        </form>
                                    </div>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>

<!-- ========================================================= -->
<!-- MODAL -->
<!-- ========================================================= -->
<div class="modal fade"
     id="modalEdicion"
     tabindex="-1"
     aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content border-0 shadow">
            <div class="modal-header bg-primary text-white py-2">
                <h6 class="modal-title fw-bold text-uppercase">Editar Plantilla Maestra</h6>
                <button type="button"
                        class="btn-close btn-close-white"
                        data-bs-dismiss="modal">
                </button>
            </div>
            <form th:action="@{/conceptos/maestro/actualizar}"
                  method="post">
                <div class="modal-body bg-light">
                    <input type="hidden"
                           id="editId"
                           name="id">
                    <div class="mb-3">
                        <label class="form-label small fw-bold">
                            Descripción
                        </label>
                        <input type="text"
                               id="editDescripcion"
                               name="descripcion"
                               class="form-control shadow-sm"
                               required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label small fw-bold text-primary">
                            Cuenta Contable
                        </label>
                        <select id="editCuenta"
                                name="cuentaContableId"
                                class="form-select shadow-sm">
                            <option value="">-- Sin cuenta --</option>
                            <option th:each="cta : ${cuentasIngreso}"
                                    th:value="${cta.id}"
                                    th:text="${cta.codigo + ' - ' + cta.nombre}">
                            </option>
                            <option th:each="cta : ${cuentasPasivo}"
                                    th:value="${cta.id}"
                                    th:text="${cta.codigo + ' - ' + cta.nombre}">
                            </option>
                        </select>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label small fw-bold text-warning">Tipo Impuesto</label>
                            <select id="editTipoImpuesto"
                                    name="tipoImpuesto"
                                    class="form-select shadow-sm">
                                <option value="EXENTO">EXENTO</option>
                                <option value="IVA">IVA</option>
                                <option value="IGIC">IGIC</option>
                                <option value="IPSI">IPSI</option>
                            </select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label small fw-bold text-warning">% Impuesto</label>
                            <input type="number"
                                   step="0.01"
                                   min="0"
                                   max="100"
                                   id="editPorcentajeImpuesto"
                                   name="porcentajeImpuesto"
                                   class="form-control shadow-sm">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label small fw-bold">Periodicidad</label>
                            <select id="editPeriodicidad"
                                    name="periodicidad"
                                    class="form-select shadow-sm">
                                <option value="MENSUAL">Mensual</option>
                                <option value="BIMESTRAL">Bimestral</option>
                                <option value="TRIMESTRAL">Trimestral</option>
                                <option value="ANUAL">Anual</option>
                            </select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label small fw-bold">Mes Inicio</label>
                            <input type="number"
                                   id="editMes"
                                   name="mesInicio"
                                   min="1"
                                   max="12"
                                   class="form-control shadow-sm">
                        </div>
                    </div>
                </div>
                <div class="modal-footer bg-white">
                    <button type="button" class="btn btn-sm btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-sm btn-primary px-4 shadow-sm">Guardar Cambios</button>
                </div>
            </form>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script th:inline="javascript">
    function toggleMesInicio() {
        const period = document.getElementById('periodSelect').value;
        const div = document.getElementById('divMesInicio');
        if (div) {
            div.style.display =
                (period === 'MENSUAL')
                    ? 'none'
                    : 'block';
        }
    }
    function abrirModalEdicion(
        id,
        desc,
        perio,
        mes,
        ctaId,
        tipoImpuesto,
        porcentajeImpuesto
    ) {
        document.getElementById('editId').value = id;
        document.getElementById('editDescripcion').value = desc;
        document.getElementById('editPeriodicidad').value = perio;
        document.getElementById('editMes').value = mes;
        document.getElementById('editCuenta').value = ctaId || "";
        document.getElementById('editTipoImpuesto').value =
            tipoImpuesto || "EXENTO";
        document.getElementById('editPorcentajeImpuesto').value =
            porcentajeImpuesto || 0;
        new bootstrap.Modal(
            document.getElementById('modalEdicion')
        ).show();
    }
    document.addEventListener("DOMContentLoaded", function() {
        toggleMesInicio();
    });
</script>
<style>
    .bg-info-subtle {
        background-color: #e3f2fd !important;
    }
    .text-info {
        color: #0d6efd !important;
    }
    .border-info-subtle {
        border-color: #cfe2ff !important;
    }
    .table th {
        font-size: 0.75rem;
        letter-spacing: 0.05rem;
    }
    .sidebar {
        min-width: 240px;
        position: sticky;
        top: 0;
        height: 100vh;
    }
    .btn-outline-primary:hover {
        background-color: #0d6efd;
        color: white;
    }
</style>
</body>
</html>
