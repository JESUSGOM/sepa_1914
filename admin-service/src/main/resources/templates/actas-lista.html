<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head}"></head>
<body class="bg-light">
<div class="container-fluid">
    <div class="row">
        <div th:replace="~{layout :: menu}"></div>

        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4">
            <div class="d-flex justify-content-between align-items-center mt-4 mb-4">
                <div>
                    <h1 class="h3 mb-0 text-gray-800">Actas de Reuniones</h1>
                    <p class="text-muted" th:text="${comunidad.nombre}">Nombre de la Comunidad</p>
                </div>
                <a th:href="@{/actas/nueva(comunidadId=${comunidad.id})}" class="btn btn-primary shadow-sm">
                    <i class="bi bi-plus-circle"></i> Redactar Nueva Acta
                </a>
            </div>

            <div th:if="${mensaje}" class="alert alert-success alert-dismissible fade show shadow-sm" role="alert">
                <i class="bi bi-check-circle-fill me-2"></i> <span th:text="${mensaje}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>

            <div class="card shadow mb-4">
                <div class="card-header py-3 bg-white">
                    <h6 class="m-0 font-weight-bold text-primary">Histórico de Actas Blindadas</h6>
                </div>
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle">
                            <thead class="table-light">
                            <tr>
                                <th>Fecha Reunión</th>
                                <th>Título / Asunto</th>
                                <th class="text-center">Estado</th>
                                <th class="text-end">Acciones</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="acta : ${actas}">
                                <td th:text="${#temporals.format(acta.fechaReunion, 'dd/MM/yyyy')}"></td>
                                <td>
                                    <strong th:text="${acta.titulo}"></strong>
                                    <br><small class="text-muted" th:text="'ID: #' + ${acta.id}"></small>
                                </td>
                                <td class="text-center">
                                    <span class="badge"
                                          th:classappend="${acta.estado.name() == 'BORRADOR' ? 'bg-secondary' : 'bg-success'}"
                                          th:text="${acta.estado}">BORRADOR</span>
                                </td>
                                <td class="text-end">
                                    <div class="btn-group shadow-sm">
                                        <a th:href="@{/actas/ver-pdf/{id}(id=${acta.id})}"
                                           class="btn btn-outline-danger btn-sm"
                                           target="_blank" title="Ver PDF">
                                            <i class="bi bi-file-pdf"></i>
                                        </a>

                                        <a th:if="${acta.estado.name() == 'BORRADOR'}"
                                           th:href="@{/actas/editar/{id}(id=${acta.id})}"
                                           class="btn btn-outline-primary btn-sm"
                                           title="Editar Acta">
                                            <i class="bi bi-pencil"></i>
                                        </a>

                                        <a th:if="${acta.estado.name() == 'BORRADOR'}"
                                           th:href="@{/actas/finalizar/{id}(id=${acta.id})}"
                                           class="btn btn-outline-success btn-sm"
                                           title="Finalizar y preparar para firma"
                                           onclick="return confirm('¿Estás seguro de finalizar el acta? Una vez cerrada no podrás editarla.')">
                                            <i class="bi bi-pen"></i>
                                        </a>
                                    </div>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>
<div th:replace="~{layout :: scripts}"></div>
</body>
</html>
