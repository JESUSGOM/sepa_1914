<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head}">
    <title>Historial de Remesas - SEPA 1914</title>
</head>
<body>
<div class="container-fluid">
    <div class="row">
        <div th:replace="~{layout :: menu}"></div>

        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4">
            <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                <h1 class="h2"><i class="bi bi-clock-history text-warning"></i> Historial de Remesas Generadas</h1>
                <div class="btn-toolbar mb-2 mb-md-0">
                    <a th:href="@{/comunidades/lista}" class="btn btn-sm btn-outline-secondary shadow-sm">
                        <i class="bi bi-arrow-left"></i> Volver a Comunidades
                    </a>
                </div>
            </div>

            <div class="card shadow-sm mt-3 border-0">
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-dark">
                            <tr>
                                <th class="ps-4">Fecha Emisión</th>
                                <th>Finca / Comunidad</th>
                                <th>Identificador</th>
                                <th class="text-end">Nº Recibos</th>
                                <th class="text-end">Importe Total</th>
                                <th class="text-center">Acciones</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="remesa : ${remesas}">
                                <td class="ps-4">
                                    <div class="fw-bold" th:text="${#temporals.format(remesa.fechaCreacion, 'dd/MM/yyyy')}">01/01/2026</div>
                                    <small class="text-muted" th:text="${remesa.id}">ID</small>
                                </td>
                                <td>
                                    <span class="text-dark fw-bold" th:text="${remesa.comunidad.nombre}">Nombre Comunidad</span>
                                </td>
                                <td>
                                    <code class="small text-primary" th:text="${remesa.identificadorFichero}">REM-123</code>
                                </td>
                                <td class="text-end" th:text="${remesa.numeroRecibos}">0</td>
                                <td class="text-end fw-bold text-success">
                                    <span th:text="${#numbers.formatDecimal(remesa.totalImporte, 1, 'POINT', 2, 'COMMA')}">0,00</span> €
                                </td>
                                <td class="text-center">
                                    <a th:href="@{/comunidades/descargar-remesa-guardada/{id}(id=${remesa.id})}"
                                       class="btn btn-sm btn-dark shadow-sm">
                                        <i class="bi bi-cloud-download me-1"></i> Descargar .C19
                                    </a>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(remesas)}">
                                <td colspan="6" class="text-center py-5 text-muted">
                                    <i class="bi bi-file-earmark-x display-4 d-block mb-3 opacity-25"></i>
                                    Aún no has generado ninguna remesa bancaria.
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>
<div th:replace="~{layout :: scripts}"></div>
</body>
</html>
